<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOLTV - Hybrid IPTV Platform</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-tv text-red-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider text-white">LOLTV <span class="text-xs bg-red-600 px-2 py-0.5 rounded text-white">Public Edition</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <!-- NXST Login Redirect Button -->
            <a href="http://192.168.0.227:8000/NXST%20IPTV%20-%20Multi-Category%20Luxury%20Edition.html" target="_blank" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md transition flex items-center space-x-2">
                <i class="fa-solid fa-user-shield"></i>
                <span>Login as NXST User</span>
            </a>
            <!-- Admin Panel Button -->
            <button onclick="openAdminModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-gear"></i> Admin
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-2xl font-semibold text-slate-100">Available Channels</h2>
            <div class="text-sm text-slate-400">Public Streams Live</div>
        </div>

        <!-- Channels Grid -->
        <div id="channels-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Channels Will Load Dynamically -->
        </div>
    </main>

    <!-- Admin Login / Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center">
        <div class="glass p-6 rounded-2xl w-96 max-w-full relative shadow-2xl">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div id="admin-auth-view">
                <h3 class="text-xl font-bold mb-4 text-white">Admin Authentication</h3>
                <p class="text-sm text-slate-400 mb-4">Enter password to access management control.</p>
                <input type="password" id="admin-pass-input" placeholder="Enter Password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white mb-4 focus:outline-none focus:border-red-500">
                <button onclick="verifyAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition">Login</button>
            </div>
            <div id="admin-dashboard-view" class="hidden">
                <h3 class="text-xl font-bold mb-4 text-white">Admin Control Panel</h3>
                <p class="text-sm text-slate-400 mb-4">Toggle locks for channels or streams.</p>
                <div id="admin-channels-list" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                    <!-- Admin Channel Items -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="glass py-4 text-center text-sm text-slate-400">
        &copy; 2026 LOLTV Platform. Public & NXST Hybrid Architecture.
    </footer>

    <!-- Application Script -->
    <script>
        // Default Channels Data (Embedded directly to avoid any fetch/404 issues)
        let channelsData = [
            { name: "TNT Sports 1", logo: "https://via.placeholder.com/150", url: "#" },
            { name: "TNT Sports 2", logo: "https://via.placeholder.com/150", url: "#" },
            { name: "BeIN Sports 1", logo: "https://via.placeholder.com/150", url: "#" },
            { name: "BeIN Sports 2", logo: "https://via.placeholder.com/150", url: "#" },
            { name: "GTV Public", logo: "https://via.placeholder.com/150", url: "#" },
            { name: "T Sports Public", logo: "https://via.placeholder.com/150", url: "#" }
        ];

        let lockedChannels = JSON.parse(localStorage.getItem('lockedChannels')) || {};

        function initApp() {
            renderChannels();
        }

        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '';

            channelsData.forEach((channel, index) => {
                let isLocked = lockedChannels[index] || false;
                let cardHTML = `
                    <div class="glass rounded-xl overflow-hidden shadow-lg relative group transition hover:scale-[1.02]">
                        <div class="h-40 bg-slate-800 flex items-center justify-center relative">
                            <img src="${channel.logo}" alt="${channel.name}" class="h-24 object-contain">
                            ${isLocked ? `
                                <div class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center">
                                    <i class="fa-solid fa-lock text-red-500 text-3xl mb-2"></i>
                                    <span class="text-xs font-semibold text-red-400">Only for NXST Users</span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-white truncate">${channel.name}</h3>
                            <button onclick="playChannel(${index})" class="mt-3 w-full bg-slate-700 hover:bg-slate-600 text-white text-sm py-2 rounded-lg transition flex items-center justify-center space-x-2 ${isLocked ? 'opacity-50 cursor-not-allowed' : ''}">
                                <i class="fa-solid fa-play"></i><span>Play Stream</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function playChannel(index) {
            if (lockedChannels[index]) {
                alert("This channel is restricted! Please click 'Login as NXST User' above to access premium ISP streams.");
                return;
            }
            alert("Playing public stream for: " + channelsData[index].name);
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-auth-view').classList.remove('hidden');
            document.getElementById('admin-dashboard-view').classList.add('hidden');
            document.getElementById('admin-pass-input').value = '';
        }

        function verifyAdmin() {
            let pass = document.getElementById('admin-pass-input').value;
            if (pass === 'lolyt69') {
                document.getElementById('admin-auth-view').classList.add('hidden');
                document.getElementById('admin-dashboard-view').classList.remove('hidden');
                renderAdminList();
            } else {
                alert('Incorrect Password!');
            }
        }

        function renderAdminList() {
            let list = document.getElementById('admin-channels-list');
            list.innerHTML = '';
            channelsData.forEach((channel, index) => {
                let isLocked = lockedChannels[index] || false;
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-lg">
                        <span class="text-sm truncate text-white">${channel.name}</span>
                        <button onclick="toggleLock(${index})" class="px-3 py-1 rounded text-xs font-semibold ${isLocked ? 'bg-red-600 text-white' : 'bg-slate-700 text-slate-300'}">
                            ${isLocked ? '<i class="fa-solid fa-lock"></i> Locked' : '<i class="fa-solid fa-lock-open"></i> Unlocked'}
                        </button>
                    </div>
                `;
            });
        }

        function toggleLock(index) {
            lockedChannels[index] = !lockedChannels[index];
            localStorage.setItem('lockedChannels', JSON.stringify(lockedChannels));
            renderAdminList();
            renderChannels();
        }

        // Run application on load
        initApp();
    </script>
</body>
</html>
